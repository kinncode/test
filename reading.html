        }
        
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .animate-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 朗讀時的波紋動畫 */
        .speaking-pulse {
            animation: pulse-blue 2s infinite;
        }
        
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

                  { word: 'amenities', part: 'n.', def: '設施', sent: 'The hotel has great amenities.' },
                  { word: 'impressed', part: 'adj.', def: '印象深刻的', sent: 'I was impressed by the service.' },
                  { word: 'awake', part: 'adj.', def: '清醒', sent: 'The noise kept me awake.' },
                  { word: 'resort', part: 'n.', def: '渡假飯店', sent: 'We stayed at a luxury resort.' }
                ]
              },
              {
                id: 20,
                title: 'Unit R4-1: Cheap Toys',
                category: 'News',
                segments: [
                  { en: "Every year, the government is on the lookout for dangerous toys.", zh: "每年，政府都會密切關注危險玩具。" },
                  { en: "China is responsible for many of the mass-produced plastic toys.", zh: "中國負責許多大量生產的塑膠玩具。" },
                  { en: "The factories often use cheap and toxic chemicals.", zh: "工廠經常使用廉價且有毒的化學物質。" },
                  { en: "These substances can cause developmental problems if ingested.", zh: "如果吞食這些物質，可能會導致發育問題。" },
                  { en: "Manufacturers must regulate their production practices.", zh: "製造商必須規範其生產慣例。" }
                ],
                vocabulary: [
                  { word: 'dangerous', part: 'adj.', def: '危險的', sent: 'This toy is dangerous.' },
                  { word: 'responsible', part: 'adj.', def: '需負責任的', sent: 'Who is responsible for this?' },
                  { word: 'mass-produce', part: 'v.', def: '大量生產', sent: 'They mass-produce cars.' },
                  { word: 'toxic', part: 'adj.', def: '有毒的', sent: 'Toxic chemicals are harmful.' },
                  { word: 'ingest', part: 'v.', def: '嚥下; 喝下', sent: 'Do not ingest this liquid.' },
                  { word: 'manufacturer', part: 'n.', def: '製造業者', sent: 'Contact the manufacturer for help.' }
                ]
              }
            
        ];

        // --- 單字提示框元件 ---
        const WordTooltip = ({ vocab, onClose, position }) => (
            <div 
                className="absolute z-50 bg-slate-900 text-white p-4 rounded-xl shadow-xl w-64 border border-slate-700 animate-in"
                style={{ top: position.top, left: position.left }}
            >
                <div className="flex justify-between items-start mb-2">
                    <h4 className="font-bold text-lg capitalize text-blue-300">{vocab.word}</h4>
                    <button onClick={onClose} className="text-slate-400 hover:text-white">
                        {Icons.X}
                    </button>
                </div>
                <div className="flex gap-2 items-center mb-2">
                    <span className="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300 font-mono">{vocab.part}</span>
                    <span className="text-md font-medium">{vocab.def}</span>
                </div>
                {vocab.sent && (
                    <p className="text-xs text-slate-400 italic border-l-2 border-slate-600 pl-2 mt-2">"{vocab.sent}"</p>
                )}
                <div className="absolute -bottom-2 left-4 w-4 h-4 bg-slate-900 border-r border-b border-slate-700 transform rotate-45"></div>
            </div>
        );

        // --- 閱讀器元件 ---
        const TextReader = ({ unit, settings }) => {
            const [activeWord, setActiveWord] = useState(null);
            const [expandedSentences, setExpandedSentences] = useState({});
            const [playingIndex, setPlayingIndex] = useState(null);

            const handleWordClick = (e, word) => {
                e.stopPropagation();
                const clean = cleanWord(word);
                const found = unit.vocabulary.find(v => cleanWord(v.word) === clean);
                
                if (found) {
                    const rect = e.target.getBoundingClientRect();
                    setActiveWord({
                        vocab: found,
                        position: {
                            top: rect.top - 140,
                            left: Math.max(10, rect.left - 80)
                        }
                    });
                } else {
                    setActiveWord(null);
                }
            };

            const toggleSentence = (index) => {
                setExpandedSentences(prev => ({
                    ...prev,
                    [index]: !prev[index]
                }));
            };

            const handleSpeak = (text, index) => {
                if (playingIndex === index) {
                    window.speechSynthesis.cancel();
                    setPlayingIndex(null);
                    return;
                }
                
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                
                utterance.onend = () => setPlayingIndex(null);
                
                setPlayingIndex(index);
                window.speechSynthesis.speak(utterance);
            };

            // 當單元切換時停止播放
            useEffect(() => {
                window.speechSynthesis.cancel();
                setPlayingIndex(null);
            }, [unit.id]);

            useEffect(() => {
                const closeTooltip = () => setActiveWord(null);
                window.addEventListener('click', closeTooltip);
                return () => window.removeEventListener('click', closeTooltip);
            }, []);

            return (
                <div className="relative">
                    {activeWord && (
                        <div className="fixed inset-0 z-40" onClick={() => setActiveWord(null)}>
                            <WordTooltip 
                                {...activeWord} 
                                onClose={() => setActiveWord(null)} 
                            />
                        </div>
                    )}

                    <div className="space-y-6">
                        {unit.segments.map((seg, idx) => (
                            <div 
                                key={idx} 
                                className={`transition-all duration-300 rounded-lg p-3 -mx-2 flex gap-4 items-start ${expandedSentences[idx] ? 'bg-blue-50' : 'hover:bg-slate-50'}`}
                            >
                                <button
                                    onClick={() => handleSpeak(seg.en, idx)}
                                    className={`shrink-0 mt-1 p-2 rounded-full transition-all duration-300 ${playingIndex === idx ? 'bg-blue-500 text-white speaking-pulse shadow-lg' : 'bg-white text-slate-400 border border-slate-200 hover:text-blue-500 hover:border-blue-300'}`}
                                >
                                    <div className="w-5 h-5">
                                        {playingIndex === idx ? Icons.Stop : Icons.Volume2}
                                    </div>
                                </button>
                                
                                <div className="flex-1">
                                    {settings.mode === 'interlinear' && (
                                        <div className="text-sm text-slate-500 mb-1 font-medium select-none px-1">
                                            {seg.zh}
                                        </div>
                                    )}

                                    <div 
                                        className="text-xl text-slate-800 leading-loose cursor-pointer"
                                        onClick={() => settings.mode !== 'interlinear' && toggleSentence(idx)}
                                    >
                                        {tokenize(seg.en).map((token, tIdx) => {
                                            const isWord = /^[a-zA-Z]/.test(token);
                                            const isVocab = isWord && unit.vocabulary.some(v => cleanWord(v.word) === cleanWord(token));
                                            
                                            return (
                                                <span 
                                                    key={tIdx}
                                                    onClick={(e) => isWord ? handleWordClick(e, token) : null}
                                                    className={`
                                                        inline-block rounded px-0.5 transition-colors duration-200
                                                        ${isVocab ? 'text-blue-600 font-semibold border-b-2 border-blue-200 hover:bg-blue-100 cursor-pointer' : ''}
                                                        ${!isVocab && isWord ? 'hover:text-blue-500 cursor-pointer' : ''}
                                                    `}
                                                >
                                                    {token}
                                                </span>
                                            );
                                        })}
                                    </div>

                                    {settings.mode === 'interactive' && expandedSentences[idx] && (
                                        <div className="mt-2 text-md text-slate-600 bg-white p-3 rounded border border-blue-100 shadow-sm animate-in">
                                            <span className="text-blue-400 mr-2 text-xs uppercase tracking-wider font-bold">Translation</span>
                                            {seg.zh}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- 主應用程式 ---
        function App() {
            const [currentUnitId, setCurrentUnitId] = useState(1);
            const [activeTab, setActiveTab] = useState('read'); 
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [settings, setSettings] = useState({
                mode: 'interlinear',
            });

            const [quizState, setQuizState] = useState({
                currentQ: 0,
                score: 0,
                showResult: false,
                options: [],
                selected: null
            });

            const currentUnit = studyUnits.find(u => u.id === currentUnitId);

            useEffect(() => {
                if (activeTab === 'quiz') resetQuiz();
            }, [activeTab, currentUnitId]);

            const resetQuiz = () => {
                setQuizState({ currentQ: 0, score: 0, showResult: false, options: [], selected: null });
                generateQuestion(0);
            };

            const generateQuestion = (index) => {
                if (!currentUnit?.vocabulary?.length) return;
                if (index >= currentUnit.vocabulary.length) {
                    setQuizState(prev => ({ ...prev, showResult: true }));
                    return;
                }
                const correct = currentUnit.vocabulary[index];
                const others = studyUnits.flatMap(u => u.vocabulary).filter(v => v.word !== correct.word).sort(() => 0.5 - Math.random()).slice(0, 3);
                setQuizState(prev => ({ 
                    ...prev, 
                    options: [correct, ...others].sort(() => 0.5 - Math.random()),
                    selected: null 
                }));
            };

            const handleQuizAnswer = (option) => {
                if (quizState.selected) return;
                const correct = currentUnit.vocabulary[quizState.currentQ];
                const isCorrect = option.word === correct.word;
                
                setQuizState(prev => ({ ...prev, selected: option, score: isCorrect ? prev.score + 1 : prev.score }));

                setTimeout(() => {
                    const nextQ = quizState.currentQ + 1;
                    setQuizState(prev => ({ ...prev, currentQ: nextQ }));
                    generateQuestion(nextQ);
                }, 1200);
            };

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden font-sans text-slate-900">
                    
                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform transition-transform duration-300 ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 flex flex-col`}>
                        <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h2 className="text-xl font-bold flex items-center gap-2 text-slate-800">
                                {Icons.BookOpen}
                                閱讀特訓
                            </h2>
                            <button onClick={() => setMobileMenuOpen(false)} className="md:hidden p-1 rounded hover:bg-slate-200">
                                {Icons.X}
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-3 space-y-1">
                            {studyUnits.map((unit) => (
                                <button
                                    key={unit.id}
                                    onClick={() => { setCurrentUnitId(unit.id); setActiveTab('read'); setMobileMenuOpen(false); }}
                                    className={`w-full text-left p-3 rounded-lg transition-all group ${currentUnitId === unit.id ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'hover:bg-slate-100 text-slate-600'}`}
                                >
                                    <div className={`text-xs uppercase tracking-wider mb-1 font-semibold ${currentUnitId === unit.id ? 'text-blue-200' : 'text-slate-400 group-hover:text-slate-500'}`}>{unit.category}</div>
                                    <div className="font-medium truncate text-sm">{unit.title}</div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col w-full h-full relative">
                        
                        {/* Top Navigation */}
                        <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setMobileMenuOpen(true)} className="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                                    {Icons.Menu}
                                </button>
                                <h1 className="text-lg font-bold text-slate-800 hidden sm:block truncate max-w-md">{currentUnit?.title}</h1>
                            </div>
                            
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {[
                                    { id: 'read', icon: Icons.BookOpen, label: '閱讀' },
                                    { id: 'vocab', icon: Icons.Languages, label: '單字' },
                                    { id: 'quiz', icon: Icons.Brain, label: '測驗' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === tab.id ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        <div className="w-4 h-4">{tab.icon}</div>
                                        <span className="hidden sm:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </header>

                        {/* Content Area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
                            
                            {/* READING MODE */}
                            {activeTab === 'read' && (
                                <div className="max-w-3xl mx-auto">
                                    
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                                        <div className="flex items-center gap-2 text-sm text-slate-500">
                                            {Icons.Settings}
                                            <span>顯示模式：</span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setSettings({ mode: 'interlinear' })}
                                                className={`px-4 py-2 rounded-lg text-sm font-medium border transition-all ${settings.mode === 'interlinear' ? 'bg-blue-50 border-blue-200 text-blue-700' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                            >
                                                <div className="flex items-center gap-2">
                                                    <div className="flex flex-col leading-none text-[10px] items-center gap-0.5">
                                                        <span>中</span>
                                                        <span>En</span>
                                                    </div>
                                                    對照翻譯
                                                </div>
                                            </button>
                                            <button 
                                                onClick={() => setSettings({ mode: 'interactive' })}
                                                className={`px-4 py-2 rounded-lg text-sm font-medium border transition-all ${settings.mode === 'interactive' ? 'bg-blue-50 border-blue-200 text-blue-700' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                            >
                                                <div className="flex items-center gap-2">
                                                    {Icons.MousePointer2}
                                                    點擊翻譯
                                                </div>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200 min-h-[60vh]">
                                        <TextReader unit={currentUnit} settings={settings} />
                                    </div>
                                    
                                    <div className="mt-8 text-center text-slate-400 text-sm">
                                        提示：點擊<span className="text-blue-500 font-bold mx-1">藍色單字</span>可查看詳細定義
                                    </div>
                                </div>
                            )}

                            {/* VOCAB MODE */}
                            {activeTab === 'vocab' && (
                                <div className="max-w-4xl mx-auto grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                                    {currentUnit?.vocabulary.map((vocab, idx) => (
                                        <div key={idx} className="bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition-all hover:-translate-y-1 group">
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className="text-xl font-bold text-slate-800">{vocab.word}</h3>
                                                <span className="text-xs font-mono bg-blue-50 text-blue-600 px-2 py-1 rounded-full border border-blue-100">{vocab.part}</span>
                                            </div>
                                            <p className="text-lg text-slate-700 mb-4 font-medium border-l-4 border-blue-500 pl-3 bg-slate-50 py-2 rounded-r">{vocab.def}</p>
                                            {vocab.sent && (
                                                <div className="text-sm text-slate-500 italic bg-slate-50 p-3 rounded-lg flex gap-2">
                                                    <div className="w-4 h-4 shrink-0 text-slate-400 mt-0.5">{Icons.Volume2}</div>
                                                    "{vocab.sent}"
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* QUIZ MODE */}
                            {activeTab === 'quiz' && (
                                <div className="max-w-2xl mx-auto flex flex-col justify-center h-full min-h-[60vh]">
                                    {!quizState.showResult ? (
                                        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-1 bg-slate-100">
                                                <div 
                                                    className="h-full bg-blue-500 transition-all duration-300"
                                                    style={{ width: `${((quizState.currentQ) / currentUnit.vocabulary.length) * 100}%` }}
                                                />
                                            </div>
                                            
                                            <div className="text-center mb-10 mt-4">
                                                <span className="text-xs font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wider">
                                                    Question {quizState.currentQ + 1} of {currentUnit.vocabulary.length}
                                                </span>
                                                <h3 className="text-4xl font-bold text-slate-800 mt-6 mb-2">{currentUnit?.vocabulary[quizState.currentQ]?.word}</h3>
                                                <p className="text-slate-400">What is the meaning?</p>
                                            </div>

                                            <div className="grid gap-3">
                                                {quizState.options.map((opt, idx) => {
                                                    const isCorrect = currentUnit.vocabulary[quizState.currentQ].word === opt.word;
                                                    const isSelected = quizState.selected === opt;
                                                    
                                                    let style = "bg-white hover:bg-slate-50 border-slate-200 text-slate-700";
                                                    if (quizState.selected) {
                                                        if (isCorrect) style = "bg-green-50 border-green-500 text-green-700 ring-1 ring-green-500";
                                                        else if (isSelected) style = "bg-red-50 border-red-500 text-red-700";
                                                        else style = "opacity-50 border-slate-200";
                                                    }

                                                    return (
                                                        <button
                                                            key={idx}
                                                            onClick={() => handleQuizAnswer(opt)}
                                                            disabled={!!quizState.selected}
                                                            className={`w-full p-4 rounded-xl border-2 text-left transition-all text-lg font-medium flex justify-between items-center ${style}`}
                                                        >
                                                            {opt.def}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-12 text-center">
                                            <div className="inline-flex p-6 rounded-full bg-yellow-50 text-yellow-500 mb-6 ring-8 ring-yellow-50/50">
                                                <div className="w-16 h-16">{Icons.Brain}</div>
                                            </div>
                                            <h3 className="text-3xl font-bold text-slate-800 mb-2">Quiz Completed!</h3>
                                            <p className="text-xl text-slate-600 mb-8">
                                                You scored <span className="font-bold text-blue-600 text-2xl">{quizState.score}</span> out of {currentUnit.vocabulary.length}
                                            </p>
                                            <button 
                                                onClick={resetQuiz}
                                                className="bg-slate-900 text-white px-8 py-3 rounded-xl hover:bg-slate-800 transition-colors shadow-lg shadow-slate-200 font-medium flex items-center gap-2 mx-auto"
                                            >
                                                {Icons.RotateCcw}
                                                Try Again
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
