<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Globish 客製化學習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Roboto', 'Noto Sans TC', sans-serif; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-container { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .card-front, .card-back { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .is-flipped .card-inner { transform: rotateY(180deg); }
        
        .custom-input { width: 100%; padding: 0.5rem; border: 2px solid #e2e8f0; border-radius: 0.5rem; font-weight: bold; color: #334155; outline: none; transition: border-color 0.2s; }
        .custom-input:focus { border-color: #2563eb; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div id="view-start" class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6">
        <div class="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full space-y-5">
            <div class="text-center">
                <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="book-open" class="w-7 h-7 text-blue-600"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800">學習設定</h1>
                <p class="text-xs text-slate-400 mt-1">請設定本次學習範圍</p>
            </div>
            <hr class="border-slate-100">
            <div class="space-y-4">
                <div class="input-group">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-slate-500">選擇單字庫</label>
                        <span id="list-info" class="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded-full opacity-0 transition-opacity">共 0 單字</span>
                    </div>
                    <select id="source-select" onchange="app.handleSourceChange()" class="custom-input bg-white">
                        <option value="list1">你阿媽也會英文</option>
                        <option value="list2">阿公用英文跟我吵架</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">起始 ID</label>
                        <input type="number" id="range-start" class="custom-input">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">結束 ID</label>
                        <input type="number" id="range-end" class="custom-input">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">本次測驗單字量</label>
                    <input type="number" id="limit-count" class="custom-input" placeholder="例如: 20">
                    <p class="text-[10px] text-slate-400 mt-1 text-right">*已預設填入清單總數</p>
                </div>
            </div>
            <button onclick="app.start()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95 transition-transform flex items-center justify-center shadow-lg shadow-blue-200">
                <i data-lucide="play" class="w-4 h-4 mr-2"></i> 開始學習
            </button>
        </div>
    </div>

    <div id="view-complete" class="hidden min-h-screen bg-slate-100 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-xs w-full">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check" class="w-8 h-8 text-green-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">任務完成！</h2>
            <button onclick="window.location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg flex items-center justify-center w-full gap-2">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 回到首頁
            </button>
        </div>
    </div>

    <div id="view-main" class="hidden min-h-screen flex flex-col items-center pt-4 px-4 max-w-md mx-auto w-full">
        <div class="w-full flex justify-between items-center mb-4 bg-white p-3 rounded-xl shadow-sm">
            <div class="flex items-center gap-2 text-sm font-bold text-slate-600">
                <i data-lucide="bar-chart-3" class="w-4 h-4 text-blue-500"></i>
                <span id="progress-text">0 / 0</span>
            </div>
            <div class="flex gap-2">
                <button onclick="app.nextCard()" class="p-2 bg-slate-100 rounded-full text-slate-400">
                    <i data-lucide="skip-forward" class="w-4 h-4"></i>
                </button>
                <button id="btn-autoplay" onclick="app.toggleAutoPlay()" class="p-2 rounded-full bg-blue-100 text-blue-600">
                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                </button>
                <button onclick="app.toggleSettings()" class="p-2 bg-slate-100 rounded-full text-slate-600">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div id="settings-menu" class="hidden w-full bg-white p-4 rounded-xl shadow-md mb-4 grid grid-cols-3 gap-2 border border-slate-200">
            <button onclick="app.setMode('flashcard')" class="mode-btn p-2 rounded-lg text-xs font-bold bg-blue-600 text-white" data-mode="flashcard">背單字</button>
            <button onclick="app.setMode('spelling')" class="mode-btn p-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500" data-mode="spelling">拼字測驗</button>
            <button onclick="app.setMode('quiz')" class="mode-btn p-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500" data-mode="quiz">選擇題</button>
        </div>

        <div id="content-area" class="flex-1 w-full flex flex-col justify-center mb-6 relative">
            
            <div id="mode-flashcard" class="w-full hidden">
                <div id="flashcard-body" onclick="app.flipCard()" class="card-container cursor-pointer w-full aspect-[4/5]">
                    <div id="flashcard-inner" class="card-inner relative w-full h-full bg-white rounded-3xl shadow-xl border-b-4 border-slate-200 text-slate-800">
                        <div class="card-front absolute w-full h-full flex flex-col items-center justify-center p-6 text-center backface-hidden">
                            <h2 id="fc-word" class="text-5xl font-bold mb-4">Word</h2>
                            <span id="fc-pos" class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-bold">n.</span>
                            <button onclick="event.stopPropagation(); app.speakCurrent()" class="mt-8 p-3 bg-slate-50 rounded-full text-slate-400">
                                <i data-lucide="volume-2" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <div class="card-back absolute w-full h-full flex flex-col p-6 text-left bg-slate-800 text-white rounded-3xl backface-hidden">
                             <div class="flex justify-between items-center mb-6">
                                <h3 id="fc-back-word" class="text-2xl font-bold">Word</h3>
                                <button onclick="event.stopPropagation(); app.speakCurrent()"><i data-lucide="volume-2" class="w-5 h-5 text-slate-400"></i></button>
                            </div>
                            <div class="bg-white/10 p-4 rounded-xl mb-4">
                                <p id="fc-def" class="text-lg font-medium">Definition</p>
                            </div>
                            <div class="bg-white/10 p-4 rounded-xl">
                                <p id="fc-sentence" class="text-sm opacity-90 mb-2">Sentence</p>

                                <p id="fc-trans" class="text-xs opacity-60">Translation</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="rating-area" class="grid grid-cols-4 gap-2 mt-4 w-full hidden">
                    <button onclick="app.rate(0)" class="bg-red-100 text-red-600 py-3 rounded-xl font-bold text-sm">忘記</button>
                    <button onclick="app.rate(1)" class="bg-orange-100 text-orange-600 py-3 rounded-xl font-bold text-sm">困難</button>
                    <button onclick="app.rate(2)" class="bg-green-100 text-green-600 py-3 rounded-xl font-bold text-sm">良好</button>
                    <button onclick="app.rate(3)" class="bg-blue-100 text-blue-600 py-3 rounded-xl font-bold text-sm">簡單</button>
                </div>
            </div>

            <div id="mode-quiz" class="w-full bg-white rounded-3xl shadow-xl p-6 hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="quiz-word" class="text-3xl font-bold text-slate-800">Word</h2>
                    <button onclick="app.speakCurrent()" class="p-2 bg-green-100 text-green-600 rounded-full"><i data-lucide="volume-2" class="w-5 h-5"></i></button>
                </div>
                <div id="quiz-options" class="space-y-3"></div>
                <div id="quiz-feedback" class="mt-4 text-center text-slate-400 text-sm hidden animate-pulse">顯示正確答案中...</div>
            </div>

            <div id="mode-spelling" class="w-full bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center hidden">
                <button onclick="app.speakCurrent()" class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mb-6 active:scale-95 transition-transform">
                    <i data-lucide="volume-2" class="w-10 h-10 text-purple-600"></i>
                </button>
                <p id="sp-def" class="text-slate-500 mb-6 text-center">Definition</p>
                <form onsubmit="app.handleSpelling(event)" class="w-full">
                    <input id="sp-input" type="text" class="w-full text-center text-2xl font-bold border-2 border-slate-200 rounded-xl py-3 mb-4 outline-none focus:border-purple-500" placeholder="輸入單字..." autocomplete="off">
                    <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold">送出</button>
                </form>
            </div>
        </div>
    </div>
    <script>
const DATA_SOURCES = {
  list1: `
01. a (art.) 個
I'd like to have a cat.
我想要養一隻貓。
02. able (adj.) 能夠的
Tom is able to go to Hong Kong in March.
湯姆在3月能去香港。
03. about (prep.) 關於
What is this letter about?
這封信是關於甚麼呢?
04. above (prep.) 在...之上
The air conditioner is above the window.
冷氣在窗戶上面。
05. accept (v.) 接受
Unfortunately, I am unable to accept your invitation.
很不幸地,我無法接受您的邀請。
06. according (to) (prep.) 根據
According to Pam, the meeting will start at 2:00pm.
根據 Pam 的說法,會議將在下午兩點開始。
07. account (n.) 存款帳戶
I need to open a new bank account.
我需要開一個新的帳戶銀行。
08. accuse (v.) 控訴
Phil accused Marsha of breaking the printer.
菲爾指控馬莎弄壞印表機。
09. achieve (v.) 成就
We can achieve our desired results if we work as a team.
如果我們以團隊合作,就可以達到我們的預期的結果。
10. across (prep.) 橫越
The bank is across the street from the gym.
銀行是在體育館對面。
11. act (v.) 行
If we don't act now, it will be too late.
如果我們現在不行動就太晚了。
12. adapt (v.) 適應
It is not always easy to adapt to a new environment.
適應一個新的環境總是不容易的。
13. add (v.) 增加
Three new students were added to the class.
三位新同學增加到這個班。
14. admit (v.) 准入
Only employees are admitted past this point.
只有員工能通過這個點。
15. adult (n.) 成人
Four adults went on the field trip with the elementary school.
四個成人和這所小學合作田野勘查。
16. advertisement (n.) 廣告
Online advertisements are annoying.
線上廣告是很討厭的。
17. advise (v.) 勸告
I'd advise you not to insist on your way all the time.
我會建議你別太堅持。
18. affect (v.) 影響
This medicine affects your ability to drive, so please be careful.
這藥會影響你開車,請小心。
19. afraid (adj.) 害怕的
My little sister is afraid of the dark.
我妹妹怕黑。
20. after (prep.) 在...之後
After we go to the supermarket, we are going to stop and get some ice cream.
去市場之後,我們停下來吃冰淇淋。
21. again (adv.) 再一次
I can't believe it's already time to get my haircut again.
我不敢相信我已經又要去剪頭髮了。
22. against (prep.) 相對於
It will be exciting to watch the Monkeys play against the Lions in the baseball game.
我迫不及待想看猿隊對上獅隊的棒球賽。
23. age (n.) 年齡
She could drive at the age of 15.
她15歲才能開車。
24. agency (n.) 代理所
Susan needs to contact the agency in charge of visas.
Susan 需要聯繫該負責簽證的機構。
25. ago (adv.) ...之前
I came to Taiwan fifteen years ago.
我15年前來過台灣。
26. agree (v.) 同意
Both David and Mike agree that we need to change the title of the report.
David 和 Mike 兩人都同意更改報告的標題。
27. ahead (adv.) 在前面
The university is straight ahead on the left.
這間大學在前方的左側。
28. aid (n.) 幫助
It is important to know first aid.
第一時間急救是非常重要的。
29. aim (v.) 致力於
Let's aim for four new stores opening by the end of next year.
我們就把目標放在明年年底前開四家新門市。
30. air (n.) 空氣
The air here is really dry.
這裡的空氣真的非常乾燥。
31. alive (adj.) 活的;有活力的
Extreme sports, like hang gliding, often make people feel alive.
像滑翔翼這樣的極限運動,最能讓人感覺到活著。
32. all (adv.) 全部
We are all going to visit the capital together.
我們大家一起去參觀首都。
33. allow (v.) 允許
The children were not allowed to eat candy after dinner.
小孩子不被允許在晚飯後吃糖果。
34. ally (v.) 同盟
The Kingdom of Swaziland is considered one of Taiwan's diplomatic allies.
史瓦濟蘭王國被認為是台灣外交上的盟友之一。
35. almost (adv.) 幾乎
When this chapter is complete, Caleb will almost be done with his thesis.
完成了這一章 Caleb 幾乎完成他的論文了。
36. alone (adj.) 單獨的
He often feels lonely when he's alone.
他經常在獨處時感到寂寞。
37. along (prep.) 沿著
If you walk along this street for about ten minutes, you'll eventually reach the coastline.
沿著這條路走十分鐘,你將會到達海岸線。
38. already (adv.) 已經
I've already told you many times the answer to that question.
這個問題的答案我已經告訴你很多次了。
39. also (adv.) 也
In addition to visiting Germany and Italy, Sam is also going to make a stop in France.
除了參觀德國和義大利,Sam 也會在法國落腳。
40. although (conj.) 雖然
Although I can't attend your wedding, I'd still like to give you this gift.
雖然不能參加你的婚禮,我還是想給你這份禮物。
41. always (adv.) 總是
She is always on time.
她總是準時。
42. among (prep.) 在...之中
A Taiwanese athlete was among the first to compete.
一名台灣的運動員在競爭領先群當中。
43. amount (n.) 總數
What was the total amount spent on decorations for the festival?
花在節日裝飾品上的總額是多少?
44. and (conj.) 和
I have been to Thailand and Malaysia.
我曾去過泰國和馬來西亞。
45. anger (n.) 怒氣

小孩子需要學習如何控制自己的憤怒。
46. angle (n.) 角度
I like the angle of this picture.
我喜歡這張照片拍攝的角度。
47. announce (v.) 宣布
The flight attendant announced over the loudspeaker that the flight would be delayed for twenty-five minutes.
空服員用擴音器宣布該航班將延誤25分鐘。
48. another (pron.) 另一個
Since this meeting room is reserved, we'll get another.
由於這間會議室已被預約,我們將使用另一間會議室。
49. answer (n.) 解答
We are eagerly awaiting his answer.
我們正熱切地等待他的回答。
50. any (adj.) 任一個
Even though it was my birthday, I didn't get to eat any of the cake.
即使是我的生日,但我並沒吃到什麼蛋糕。
51. apartment (n.) 公寓
They recently signed a lease on a small apartment in Kaohsiung.
他們最近在高雄簽約租了間小公寓。
52. apologize (v.) 道歉
Everyone was surprised when Crystal openly apologized for her bad attitude.
大家都對 Crystal 公開為態度不好道歉而感到驚訝。
53. appeal (v.) 請求
The family is appealing the court's ruling in this case.
這個家庭對法院的判決提出上訴。
54. appear (v.) 出現
This problem first appeared two years ago.
這個問題最先於兩年前出現。
55. apple (n.) 蘋果
There are many varieties of apples; some are good for baking, while others are great eaten raw.
蘋果有許多品種,一些適用於烘培,而其他適合直接吃。
56. apply (v.) 申請
Bethany applied to three different universities.
Bethany 申請了三所不同的大學。
57. appoint (v.) 任用
Mr. Lee has been appointed as the new chairman.
李先生已經被指定為新的主席。
58. approve (v.) 同意
The accounting office will not approve the recent budget changes.
會計室將否決最近的預算變更。
59. area (n.) 地區
The coastal area suffered great loss during the recent typhoon.
海岸地區在最近的颱風期間遭受了不少損失。
60. argue (v.) 爭吵
Please don't argue about this matter any longer; it's not worth it.
請不要再爭論這件事了,它不值得。
61. arm (n.) 手臂
Katherine broke her arm last week.
凱瑟琳上星期弄斷了她的手臂。
62. army (n.) 軍隊
The Russian army is conducting practice drills to scare their enemy.
為了恐嚇他們的敵人,俄羅斯軍隊正在實地演練。
63. around (adj.) 在周圍
The supermarket is around the corner from the gym.
超級市場在建身房附近的轉角處。
64. arrest (v.) 逮捕
The suspect was arrested after a long police chase.
嫌疑犯在警察長時間的追捕下被逮捕。
65. arrive (v.) 到達
We will arrive in Korea tomorrow evening.
我們將於明天晚上抵達韓國。
66. art (n.) 藝術
Charles signed up for art classes so he could learn how to paint.
查爾斯報名藝術班,因此他會學習如何畫畫。
67. as (conj.) 當
As soon as I get my passport, I can apply for the visa.
一旦我得到我的護照就能申請簽證。
68. ask (v.) 問;要求
Please ask the travel agent to confirm the flight times.
請要求旅行社確定班機時間。
69. assist (v.) 幫忙

空服員協助了母親和小嬰兒。
70. at (prep.) 在
We are going to meet at the cafe on the corner at 7:00pm.
我們將於下午7:00 在轉角的咖啡館裏見面。
71. attach (v.) 附加

我把最後草稿附在這一封電子郵件。
72. attack (n.) 攻擊

最近的攻擊已經被歸因於極端分子。
73. attempt (v.) 嘗試:試圖

比薩店以最大可以遞送的比薩來企圖打破世界紀錄。
74. attend (v.) 出席

所有員工一定要參加會議。
75. attention (n.) 注意力
I need your attention please.
我需要你的關注。
76. authority (n.) 權威

她沒有權力改變合約細節。
77. automatic (adj.) 自動的

雜貨店安裝了自動門。
78. autumn (n.) 秋天
Autumn is my favorite season due to the cool air and gorgeous colors of changing leaves.
由於涼爽的空氣和落葉的華麗顏色,所以秋天是我最喜愛的季節。
79. available (adj.) 有空的
Will you be avaliable next Tuesday morning for the conference?
你有空出席參加下星期二的會議嗎?
80. average (adj.) 普通的,中等的
Keisha was an average student.
Keisha 是個普通的學生。
81. avoid (v.) 避免
These mistakes could have been avoided if you had asked for help.
如果你請求幫忙就可以避免這些失誤。
82. awake (adj.) 醒著的
Is the baby awake?
小寶寶是醒著的嗎?
83. award (n.) 獎賞
There is a NT$10,000 award for the person who wins the competition.
誰贏得這場比賽,就可以獲得新台幣一萬元的獎賞。
84. away (adv.) 遠離
The office assistant will be away for the day.
有一天辦公室的助理將要離開。
85. baby (n.) 寶貝
Whose cute baby is this?
這可愛的小寶寶是誰的?
86. back (n.) 後面
The restrooms are in the back of the building.
廁所在大樓的後面。
87. bad (adj.) 不好的
These mangos have already gone bad.
這些芒果已經壞掉了。
88. bag (n.) 袋子
The cashier put the books in a paper bag.

    class App {
        constructor() {
            this.fullDeck = [];
            this.studyQueue = [];
            this.currentCard = null;
            this.completedToday = 0;
            this.totalToStudy = 0;
            this.mode = 'flashcard';
            this.autoPlay = true;
            this.isFlipped = false;
            this.synth = window.speechSynthesis;
            this.quizProcessing = false;
        }

        init() {
            lucide.createIcons();
            this.handleSourceChange();
        }

        // --- Data ---
        handleSourceChange() {
            const select = document.getElementById('source-select');
            const sourceKey = select.value;
            const rawData = DATA_SOURCES[sourceKey] || "";
            this.fullDeck = this.parseData(rawData);
            
            // 1. 更新單字總數標籤
            const total = this.fullDeck.length;
            const infoSpan = document.getElementById('list-info');
            if(infoSpan) {
                infoSpan.innerText = `共 ${total} 單字`;
                infoSpan.classList.remove('opacity-0');
            }

            // 2. 自動填入範圍和測驗數量
            if (total > 0) {
                const ids = this.fullDeck.map(c => c.id);
                document.getElementById('range-start').value = Math.min(...ids);
                document.getElementById('range-end').value = Math.max(...ids);
                
                // NEW: 自動預設填入總數
                document.getElementById('limit-count').value = total;
            } else {
                document.getElementById('range-start').value = '';
                document.getElementById('range-end').value = '';
                document.getElementById('limit-count').value = '';
            }
        }

        parseData(text) {
            const lines = text.trim().split('\n');
            const list = [];
            let item = null;
            for (let line of lines) {
                const titleMatch = line.match(/^(\d+)\.\s+(.+?)\s+(\(.+?\))\s+(.+)$/);
                if (titleMatch) {
                    if (item) list.push(item);
                    item = {
                        id: parseInt(titleMatch[1]),
                        word: titleMatch[2],
                        pos: titleMatch[3],
                        definition: titleMatch[4],
                        sentence: "",
                        translation: "",
                        interval: 0,
                        dueDate: Date.now()
                    };
                } else if (item) {
                    if (!item.sentence) item.sentence = line.trim();
                    else if (!item.translation) item.translation = line.trim();
                }
            }
            if (item) list.push(item);
            return list;
        }

        // --- Start ---
        start() {
            this.initAudio();
            const startID = parseInt(document.getElementById('range-start').value) || 0;
            const endID = parseInt(document.getElementById('range-end').value) || 99999;
            let limit = parseInt(document.getElementById('limit-count').value) || 0;

            let filtered = this.fullDeck.filter(c => c.id >= startID && c.id <= endID);
            
            if (filtered.length === 0) {
                alert("此範圍內找不到單字，請重新設定！");
                return;
            }

            if (limit > 0 && limit < filtered.length) {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
                filtered = filtered.slice(0, limit);
            }

            this.studyQueue = filtered;
            this.totalToStudy = this.studyQueue.length;
            this.completedToday = 0;

            document.getElementById('view-start').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            
            this.speak("Start");
            this.loadCard();
        }

        // --- Core ---
        loadCard() {
            if (this.studyQueue.length === 0) {
                document.getElementById('view-main').classList.add('hidden');
                document.getElementById('view-complete').classList.remove('hidden');
                return;
            }

            this.currentCard = this.studyQueue[0];
            this.isFlipped = false;
            this.quizProcessing = false;
            
            document.getElementById('progress-text').innerText = `${this.completedToday} / ${this.totalToStudy}`;
            document.getElementById('mode-flashcard').classList.add('hidden');
            document.getElementById('mode-quiz').classList.add('hidden');
            document.getElementById('mode-spelling').classList.add('hidden');

            if (this.mode === 'flashcard') this.renderFlashcard();
            else if (this.mode === 'quiz') this.renderQuiz();
            else if (this.mode === 'spelling') this.renderSpelling();

            lucide.createIcons();
        }

        nextCard(updatedCard = null) {
            let newQueue = this.studyQueue.slice(1);
            if (updatedCard && updatedCard.interval < 5) {
                newQueue.push(updatedCard);
            } else {
                this.completedToday++;
            }
            this.studyQueue = newQueue;
            this.loadCard();
        }

        // --- Renderers ---
        renderFlashcard() {
            document.getElementById('mode-flashcard').classList.remove('hidden');
            document.getElementById('flashcard-inner').style.transform = "rotateY(0deg)";
            document.getElementById('rating-area').classList.add('hidden');

            document.getElementById('fc-word').innerText = this.currentCard.word;
            document.getElementById('fc-pos').innerText = this.currentCard.pos;
            document.getElementById('fc-back-word').innerText = this.currentCard.word;
            document.getElementById('fc-def').innerText = this.currentCard.definition;
            document.getElementById('fc-sentence').innerText = this.currentCard.sentence;
            document.getElementById('fc-trans').innerText = this.currentCard.translation;
        }

        flipCard() {
            if (this.isFlipped) return;
            this.isFlipped = true;
            document.getElementById('flashcard-inner').style.transform = "rotateY(180deg)";
            document.getElementById('rating-area').classList.remove('hidden');
            document.getElementById('rating-area').classList.add('fade-in');
            if (this.autoPlay) this.speakCurrent();
        }

        renderQuiz() {
            document.getElementById('mode-quiz').classList.remove('hidden');
            document.getElementById('quiz-word').innerText = this.currentCard.word;
            document.getElementById('quiz-feedback').classList.add('hidden');
            
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';

            let distractors = this.fullDeck.filter(c => c.id !== this.currentCard.id);
            distractors.sort(() => Math.random() - 0.5);
            let options = [this.currentCard, ...distractors.slice(0, 3)];
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl font-medium border-2 border-slate-100 bg-white text-slate-600 transition-all duration-300 active:scale-95";
                btn.innerText = opt.definition;
                btn.onclick = () => this.handleQuizAnswer(btn, opt.id);
                container.appendChild(btn);
            });
        }

        handleQuizAnswer(btn, id) {
            if (this.quizProcessing) return;
            this.quizProcessing = true;
            
            if (id === this.currentCard.id) {
                this.speak('Correct');
                btn.className = "w-full text-left p-4 rounded-xl font-bold border-2 border-green-500 bg-green-500 text-white shadow-lg";
                setTimeout(() => this.nextCard({ ...this.currentCard, interval: 10 }), 1000);
            } else {
                this.speak('Incorrect');
                btn.className = "w-full text-left p-4 rounded-xl font-medium border-2 border-red-500 bg-red-100 text-red-600";
                const allBtns = document.getElementById('quiz-options').children;
                for(let b of allBtns) {
                    if(b.innerText === this.currentCard.definition) {
                        b.className = "w-full text-left p-4 rounded-xl font-bold border-2 border-green-500 bg-green-500 text-white";
                    }
                }
                setTimeout(() => this.nextCard({ ...this.currentCard, interval: 1 }), 1500);
            }
        }

        renderSpelling() {
            document.getElementById('mode-spelling').classList.remove('hidden');
            document.getElementById('sp-def').innerText = this.currentCard.definition;
            const input = document.getElementById('sp-input');
            input.value = '';
            input.className = "w-full text-center text-2xl font-bold border-2 border-slate-200 rounded-xl py-3 mb-4 outline-none focus:border-purple-500";
            input.focus();
        }

        handleSpelling(e) {
            if(e) e.preventDefault();
            const input = document.getElementById('sp-input');
            const val = input.value.trim().toLowerCase();
            const target = this.currentCard.word.trim().toLowerCase();

            if (val === target) {
                this.speak('Correct');
                input.className = "w-full text-center text-2xl font-bold border-2 border-green-500 text-green-600 rounded-xl py-3 mb-4 bg-green-50";
                setTimeout(() => this.nextCard({ ...this.currentCard, interval: 10 }), 1000);
            } else {
                this.speak('Incorrect');
                input.className = "w-full text-center text-2xl font-bold border-2 border-red-500 text-red-600 rounded-xl py-3 mb-4 bg-red-50 animate-pulse";
            }
            return false;
        }

        // --- Utils ---
        initAudio() {
            if (!this.synth) return;
            const u = new SpeechSynthesisUtterance(""); u.volume = 0; this.synth.speak(u);
        }
        speak(text) {
            if (!this.synth) return;
            this.synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.9;
            const vs = this.synth.getVoices();
            const v = vs.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha')));
            if (v) u.voice = v;
            this.synth.speak(u);
        }
        speakCurrent() { if(this.currentCard) this.speak(this.currentCard.word); }
        toggleAutoPlay() {
            this.autoPlay = !this.autoPlay;
            const btn = document.getElementById('btn-autoplay');
            btn.className = this.autoPlay ? "p-2 rounded-full bg-blue-100 text-blue-600" : "p-2 rounded-full bg-slate-100 text-slate-400";
            btn.innerHTML = `<i data-lucide="${this.autoPlay ? 'volume-2' : 'volume-x'}" class="w-4 h-4"></i>`;
            lucide.createIcons();
        }
        toggleSettings() { document.getElementById('settings-menu').classList.toggle('hidden'); }
        setMode(m) {
            this.mode = m;
            document.getElementById('settings-menu').classList.add('hidden');
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.className = b.dataset.mode === m ? "mode-btn p-2 rounded-lg text-xs font-bold bg-blue-600 text-white" : "mode-btn p-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500";
            });
            this.loadCard();
        }
        rate(r) { this.nextCard({ ...this.currentCard, interval: r === 0 ? 1 : 10 }); }
    }

    var app;
    window.onload = () => {
        app = new App();
        app.init();
    };
    </script>
</body>
</html>
